name: Deploy to Cloudflare Workers

# 推送到 main 时自动构建并发布；也支持在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，新提交自动取消旧的运行
concurrency:
  group: deploy-production
  cancel-in-progress: true

# 最小权限：只读仓库内容即可，部署凭证走 secrets
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        run: npm run build

      - name: 检查 Cloudflare 凭证
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::尚未在仓库 Secrets 配置 CLOUDFLARE_API_TOKEN，本次跳过部署。配置后在 Actions 页面重跑即可。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 部署到 Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 账户 ID 可选（填了更稳）；在 Cloudflare 控制台右侧栏或域名概览页复制
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
